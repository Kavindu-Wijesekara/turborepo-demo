name: "Setup Monorepo"
description: "Setup bun and install dependencies for the monorepo"

runs:
  using: "composite"
  steps:
    - name: Setup bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.5

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
      env:
        HUSKY: 0
