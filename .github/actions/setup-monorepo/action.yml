name: "Setup Monorepo"
description: "Setup pnpm, Node.js, and install dependencies for the monorepo"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.24.0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: "pnpm"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        HUSKY: 0

    - name: Install Vercel CLI
      shell: bash
      run: pnpm add -g vercel@latest
