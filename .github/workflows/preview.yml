name: Preview Deployment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  HUSKY: 0
  TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  TURBO_TEAM: ${{ secrets.VERCEL_ORG_ID }}
  TURBO_TELEMETRY_DISABLED: 1

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Detect which paths changed
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      client: ${{ steps.filter.outputs.client }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin:
              - 'apps/admin/**'
              - 'packages/ui/**'
              - 'packages/db/**'
              - 'packages/types/**'
              - 'packages/utils/**'
            client:
              - 'apps/client/**'
              - 'packages/ui/**'
              - 'packages/types/**'
              - 'packages/utils/**'
            packages:
              - 'packages/**'

  # Wait for CI to pass
  check-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.admin == 'true' || needs.changes.outputs.client == 'true' || needs.changes.outputs.packages == 'true'
    steps:
      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: "Validate Code Quality"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  # Deploy Admin Preview (only if admin or related packages changed)
  preview-admin:
    name: Deploy Admin Preview
    needs: [changes, check-ci]
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview-admin
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Pull Vercel Environment Information
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }} --cwd=apps/admin

      - name: Build Project Artifacts
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }} --cwd=apps/admin

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --cwd=apps/admin)
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const deployment_url = '${{ steps.deploy.outputs.url }}';
            const pr_number = context.issue.number;
            const commit_sha = context.sha.substring(0, 7);
            const timestamp = new Date().toUTCString();

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Admin App Preview')
            );

            const body = [
              '## Admin App Preview Deployment',
              '',
              '| Status | Ready |',
              '|--------|-------|',
              `| Preview URL | ${deployment_url} |`,
              `| Commit | \`${commit_sha}\` |`,
              `| Updated | ${timestamp} |`,
              '',
              '> This preview will be automatically updated when you push new commits.',
            ].join('\n');

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr_number,
                body
              });
            }

  # Deploy Client Preview (only if client or related packages changed)
  preview-client:
    name: Deploy Client Preview
    needs: [changes, check-ci]
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview-client
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CLIENT_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Pull Vercel Environment Information
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }} --cwd=apps/client

      - name: Build Project Artifacts
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }} --cwd=apps/client

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --cwd=apps/client)
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const deployment_url = '${{ steps.deploy.outputs.url }}';
            const pr_number = context.issue.number;
            const commit_sha = context.sha.substring(0, 7);
            const timestamp = new Date().toUTCString();

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Client App Preview')
            );

            const body = [
              '## Client App Preview Deployment',
              '',
              '| Status | Ready |',
              '|--------|-------|',
              `| Preview URL | ${deployment_url} |`,
              `| Commit | \`${commit_sha}\` |`,
              `| Updated | ${timestamp} |`,
              '',
              '> This preview will be automatically updated when you push new commits.',
            ].join('\n');

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr_number,
                body
              });
            }
