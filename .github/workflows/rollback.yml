name: Rollback to Previous Version

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to rollback"
        required: true
        type: choice
        options:
          - admin
          - client
          - both
      commit_sha:
        description: "Commit SHA to rollback to (leave empty for previous commit)"
        required: false
        type: string

permissions:
  contents: read
  deployments: write

env:
  HUSKY: 0
  TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  TURBO_TEAM: ${{ secrets.VERCEL_ORG_ID }}
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  confirm-rollback:
    name: Confirm Rollback Details
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.determine-sha.outputs.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Determine target commit
        id: determine-sha
        run: |
          if [ -n "${{ inputs.commit_sha }}" ]; then
            TARGET_SHA="${{ inputs.commit_sha }}"
          else
            TARGET_SHA=$(git rev-parse HEAD~1)
          fi
          echo "sha=$TARGET_SHA" >> $GITHUB_OUTPUT

  rollback-admin:
    name: Rollback Admin
    needs: confirm-rollback
    if: inputs.app == 'admin' || inputs.app == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-admin
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}

    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.confirm-rollback.outputs.target_sha }}

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build @acme/admin
        run: cd apps/admin && bun run build

      - name: Deploy to Vercel
        id: deploy
        working-directory: apps/admin
        run: |
          bunx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          bunx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL=$(bunx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT

  rollback-client:
    name: Rollback Client
    needs: confirm-rollback
    if: inputs.app == 'client' || inputs.app == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-client
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CLIENT_PROJECT_ID }}

    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.confirm-rollback.outputs.target_sha }}

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build @acme/client
        run: cd apps/client && bun run build

      - name: Deploy to Vercel
        id: deploy
        working-directory: apps/client
        run: |
          bunx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          bunx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL=$(bunx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
