name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop] # Only run on develop pushes, not main (deploy handles main)

env:
  HUSKY: 0

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Single validation job - lint, format, type-check, build
  validate:
    name: Validate Code Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type checking
        run: pnpm check-types

      - name: Build all apps
        run: pnpm build
        env:
          # Dummy env vars for build validation in CI
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          DATABASE_DIRECT_URL: postgresql://dummy:dummy@localhost:5432/dummy
          CLERK_SECRET_KEY: dummy_clerk_secret_key_for_ci
          NEXT_PUBLIC_APP_URL: https://example.com
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAA_dummy_turnstile_key

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-artifacts
          path: |
            apps/*/. next
            !apps/*/.next/cache
          retention-days: 1
