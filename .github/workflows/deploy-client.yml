name: Deploy Client

on:
  push:
    branches: [main]
    paths:
      - "apps/client/**"
      - "packages/ui/**"
      - "packages/db/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "turbo.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  HUSKY: 0
  TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  TURBO_TEAM: ${{ secrets.VERCEL_ORG_ID }}
  TURBO_TELEMETRY_DISABLED: 1
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CLIENT_PROJECT_ID }}

concurrency:
  group: deploy-client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-client
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Pull Vercel Environment
        run: bunx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --cwd=apps/client

      - name: Build Project
        run: bunx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd=apps/client

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(bunx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd=apps/client)
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        run: |
          echo "## Client Deployed to Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
